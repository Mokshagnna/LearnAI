services:
  - type: web
    name: learnai
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /health
    envVars:
      # Secrets (must be provided in Render dashboard; never committed to git)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SECONDARY_API_KEY
        sync: false
      - key: GEMINI_BACKUP_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_SECONDARY_API_KEY
        sync: false
      - key: GROQ_BACKUP_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_SECONDARY_API_KEY
        sync: false
      - key: NVIDIA_BACKUP_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # Database connection pool sizing
      - key: DB_POOL_MAX_SIZE
        value: "10"

      # Provider orchestration & deadline settings
      - key: PROVIDER_ORDER
        value: groq,cloudflare
      - key: OVERALL_DEADLINE_SECONDS
        value: "40.0"
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "25.0"
      - key: MAX_PROVIDER_RETRIES
        value: "1"

      # Optional model overrides (configurable in Render dashboard)
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_FALLBACK_MODEL
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: NVIDIA_FALLBACK_MODEL
        sync: false
      - key: CLOUDFLARE_MODEL
        sync: false

      # Reverse proxy & networking for Render cloud environment
      - key: ENVIRONMENT
        value: "production"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"
